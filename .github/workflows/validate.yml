name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skill frontmatter and scripts
        run: |
          python - <<'PY'
          import pathlib, re, yaml, py_compile
          content = pathlib.Path('SKILL.md').read_text()
          assert content.startswith('---')
          end = content.find('\n---\n', 3)
          assert end != -1
          fm = yaml.safe_load(content[3:end])
          assert fm['name'] == 'hermes-council-builder'
          assert 'description' in fm and len(fm['description']) <= 1024
          assert len(content) <= 100000
          py_compile.compile('scripts/init-hermes-council.py', doraise=True)
          py_compile.compile('scripts/validate-council.py', doraise=True)
          print('ok')
          PY
