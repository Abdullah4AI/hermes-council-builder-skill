name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skill frontmatter and scripts
        run: |
          python - <<'PY'
          import pathlib, py_compile
          root = pathlib.Path('hermes-council-builder')
          content = (root / 'SKILL.md').read_text()
          assert content.startswith('---')
          end = content.find('\n---\n', 3)
          assert end != -1
          frontmatter = content[3:end]
          fields = {}
          for line in frontmatter.splitlines():
              if ':' in line and not line.startswith(' '):
                  key, value = line.split(':', 1)
                  fields[key.strip()] = value.strip().strip('"')
          assert fields.get('name') == 'hermes-council-builder'
          assert 'description' in fields and len(fields['description']) <= 1024
          assert len(content) <= 100000
          py_compile.compile(str(root / 'scripts/init-hermes-council.py'), doraise=True)
          py_compile.compile(str(root / 'scripts/validate-council.py'), doraise=True)
          print('ok')
          PY
